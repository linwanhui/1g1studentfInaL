:root{
  --night:#0e1c30;--night2:#16304f;--night3:#1f3f66;--panel:#12233a;
  --paper:#f7f4ea;--tile:#e9f1e6;--ink:#17261e;--muted:#5a6d61;--line:#2a3b31;
  --accent:#f28c28;--gold:#ffcf3f;--ok:#1d9a57;--bad:#cf4a3c;
  --fact:#1769c2;--fact-bg:#e4f0fd;--opin:#e0701f;--opin-bg:#fff0e2;
  --low:#3f9b5a;--mid:#d9a21b;--high:#d8452f;
  --r:14px;--shadow:0 10px 30px #0004;
  --font:MRTSans,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --fs:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:var(--font)}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
button:disabled{cursor:default;opacity:.45}
.hidden{display:none!important}
/* ───── 顶栏 ───── */
#topbar{height:58px;display:flex;align-items:center;gap:14px;padding:0 14px;background:linear-gradient(90deg,#0b1626,#15304e);color:#fff;border-bottom:3px solid var(--accent)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:9px;background:conic-gradient(#009645 0 60deg,#d42e12 0 120deg,#9900aa 0 180deg,#fa9e0d 0 240deg,#005ec4 0 300deg,#9d5b25 0);display:grid;place-items:center}
.brand .logo i{width:16px;height:16px;border-radius:50%;background:#0e1c30;display:block}
#stageNav{display:flex;gap:6px;margin:0 auto}
#stageNav button{color:#cfe0f5;padding:8px 14px;border-radius:999px;font-size:17px;font-weight:700;border:2px solid transparent;white-space:nowrap}
#stageNav button[aria-current=true]{background:var(--accent);color:#1a1205;border-color:#ffd9b0}
#stageNav button:hover:not([aria-current=true]){background:#ffffff14}
.tools{display:flex;gap:6px}
.tools button{min-width:44px;height:42px;border-radius:10px;background:#ffffff14;color:#fff;font-size:16px;padding:0 10px;white-space:nowrap}
.tools button[aria-pressed=true]{background:#ffffff2e;box-shadow:inset 0 0 0 2px #ffffff55}
/* ───── 视图 ───── */
main{height:calc(100vh - 58px);position:relative}
.view{position:absolute;inset:0;overflow:auto;display:none}
.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.stagewrap{min-height:100%;padding:22px 28px 30px;background:radial-gradient(1200px 600px at 70% -10%,#24507e 0,transparent 60%),linear-gradient(180deg,#10223a,#0b1729);color:#fff}
.kicker{display:inline-flex;gap:8px;align-items:center;background:#ffffff18;border:1px solid #ffffff30;color:#ffe2b8;padding:6px 14px;border-radius:999px;font-size:16px;font-weight:700}
h1.big{font-size:calc(40px*var(--fs));margin:12px 0 6px;font-weight:900;letter-spacing:1px}
.sub{color:#bcd0e8;font-size:calc(19px*var(--fs))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:12px;font-weight:800;font-size:calc(19px*var(--fs));background:#fff;color:var(--ink);box-shadow:0 3px 0 #0003;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#1d1203}
.btn.gold{background:var(--gold);color:#2a1d00}
.btn.ghost{background:#ffffff16;color:#fff;box-shadow:inset 0 0 0 2px #ffffff40}
.btn.dark{background:var(--night2);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:#fbe3df;color:#8a2a1f}
.btn.small{min-height:40px;padding:6px 14px;font-size:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.teacher-note{margin-top:16px;padding:12px 16px;border-left:5px solid var(--gold);background:#ffffff10;border-radius:8px;color:#ffe9b0;font-size:16px;line-height:1.6}
.teacher-note b{color:#fff}
/* ───── 引：神秘任务 ───── */
.scene{max-width:1180px;margin:18px auto 0}
.steps{display:flex;gap:8px;margin:14px 0 18px;flex-wrap:wrap}
.steps span{padding:6px 12px;border-radius:999px;background:#ffffff12;color:#9fb6d3;font-size:15px;font-weight:700}
.steps span.on{background:var(--gold);color:#2a1d00}
.steps span.done{background:#ffffff26;color:#fff}
.platform{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:stretch}
.led{background:#05080c;border-radius:16px;padding:22px 26px;border:3px solid #2b3a4b;box-shadow:inset 0 0 40px #000;font-family:var(--font)}
.led .l1{color:#ffb020;font-size:28px;font-weight:900;letter-spacing:2px}
.led .l2{color:#ff4d3a;font-size:46px;font-weight:900;margin-top:10px;animation:blink 1.2s steps(2) infinite}
.led .l3{color:#7fe0a0;font-size:20px;margin-top:10px}
@keyframes blink{50%{opacity:.25}}
.feelboard{background:#fdfaf0;color:var(--ink);border-radius:16px;padding:18px 20px;min-height:220px}
.feelboard h3{margin:0 0 10px;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:#eef2ea;border:2px solid #cfd9cc;font-size:18px;font-weight:700}
.chip.on{background:var(--opin-bg);border-color:var(--opin);color:#8a3f08}
.feelboard input{font:inherit;font-size:18px;padding:8px 12px;border-radius:10px;border:2px solid #cfd9cc;width:180px}
.clue{display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:center;background:#ffffff0c;border:1px solid #ffffff22;border-radius:20px;padding:26px}
.clue .icon{height:260px;border-radius:18px;display:grid;place-items:center;font-size:120px;background:radial-gradient(circle at 50% 40%,#2c5b8f,#0b1729)}
.clock{font-size:96px!important;font-weight:900;color:#ffcf3f;letter-spacing:4px;text-shadow:0 0 30px #ffb02088}
.clue p{font-size:calc(30px*var(--fs));line-height:1.7;margin:10px 0}
.sparks{position:relative;overflow:hidden}
.sparks i{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd36b;box-shadow:0 0 10px #ff9d2a;animation:spark 900ms linear infinite}
@keyframes spark{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
.gear{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gear>div{background:#fdfaf0;color:var(--ink);border-radius:16px;padding:16px;text-align:center;opacity:0;transform:scale(.8);transition:.4s}
.gear>div.on{opacity:1;transform:none}
.gear .e{font-size:64px}
.gear b{display:block;font-size:24px}
.gear small{color:var(--muted);font-size:16px}
.vote{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.vote button{background:#fdfaf0;color:var(--ink);border-radius:18px;padding:18px;font-size:26px;font-weight:800;border:4px solid transparent;transition:.25s}
.vote button .e{font-size:70px;display:block}
.vote button.right{border-color:var(--ok);background:#e5f7ec;transform:scale(1.04)}
.vote button.dim{opacity:.4}
.reveal-art{border-radius:18px;overflow:hidden;position:relative;margin-top:16px}
.reveal-art img{width:100%;display:block;max-height:calc(34vh / var(--z,1));object-fit:cover}
.reveal-art .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 24px;background:linear-gradient(transparent,#000c);font-size:30px;font-weight:900}
.wordpair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.wcard{background:#fdfaf0;color:var(--ink);border-radius:18px;padding:20px 22px}
.wcard .w{font-size:44px;font-weight:900}
.wcard .py{color:#a8681b;font-size:22px;font-weight:700}
.wcard p{font-size:21px;line-height:1.6;margin:8px 0}
.stage{height:180px;border-radius:14px;position:relative;overflow:hidden;background:#2a1a12;margin-top:10px}
.stage .back{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;font-size:54px;background:#3a2a1e}
.stage .back small{display:block;font-size:15px;color:#ffe2b8;text-align:center}
.curtain{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#9e1b25 0 18px,#7d121b 18px 36px);transition:transform 1.2s ease;z-index:2;display:flex;align-items:center;justify-content:center;color:#ffe2b8;font-size:20px;font-weight:800}
.curtain.l{left:0}.curtain.r{right:0}
.stage.open .curtain.l{transform:translateX(-92%)}.stage.open .curtain.r{transform:translateX(92%)}
.stage .front{position:absolute;left:0;right:0;bottom:0;height:46px;background:#c9a46a;z-index:3;display:flex;align-items:center;justify-content:center;font-weight:800;color:#3a2a1e}
.fo-split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
.fo-box{border-radius:18px;padding:22px;color:var(--ink)}
.fo-box.f{background:var(--fact-bg);border:4px solid var(--fact)}
.fo-box.o{background:var(--opin-bg);border:4px solid var(--opin)}
.fo-box h3{margin:0 0 8px;font-size:30px}
.fo-box .said{font-size:26px;font-weight:800;margin:8px 0}
.fo-box .why{font-size:20px;color:#3d4c44}
.mission{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.mission div{background:#fdfaf0;color:var(--ink);border-radius:16px;padding:18px;font-size:21px;line-height:1.55;font-weight:700}
.mission .e{font-size:42px;display:block}
/* ───── 学：课文 ───── */
.tabs{display:flex;gap:8px;margin:12px 0 16px;flex-wrap:wrap}
.tabs button{padding:10px 18px;border-radius:12px;background:#ffffff14;color:#d9e6f5;font-weight:800;font-size:18px}
.tabs button[aria-selected=true]{background:#fdfaf0;color:var(--ink)}
.paper{background:var(--paper);color:var(--ink);border-radius:16px;padding:22px 30px 26px;max-width:1180px;margin:0 auto;box-shadow:var(--shadow)}
.mast{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double #2b2b2b;padding-bottom:6px;font-size:16px;color:#444}
.mast b{font-size:20px;color:#111}
.headline{font-size:calc(42px*var(--fs));font-weight:900;text-align:center;margin:14px 0 2px}
.subhead{text-align:right;font-size:calc(26px*var(--fs));font-weight:700;margin:0 40px 10px 0}
.para{display:grid;grid-template-columns:46px 1fr 300px;gap:14px;align-items:start;padding:12px 6px;border-radius:12px;transition:background .3s}
.para.hl{background:#fff6c9}
.para.reading{background:#e3f1ff}
.pnum{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;margin-top:6px}
.ptext{font-size:calc(27px*var(--fs));line-height:2.05;letter-spacing:.5px}
.ptext .w{border-bottom:3px dotted var(--accent);font-weight:800;color:#7a3c00;padding:0 1px;border-radius:4px;font-size:inherit;line-height:inherit}
.ptext .w:hover{background:#ffe7c7}
.ptext ruby rt{font-size:.45em;color:#a8681b;font-weight:700}
.side{display:flex;flex-direction:column;gap:8px}
.side .say{align-self:flex-start}
.margin-q{background:#fde8d6;border-radius:12px;padding:10px 14px;font-size:18px;line-height:1.5;position:relative}
.margin-q:before{content:"";position:absolute;left:-10px;top:16px;border:8px solid transparent;border-right-color:#fde8d6;border-left:0}
.margin-q .ans{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed #d9a37a;color:#7a3c00;font-weight:700}
.margin-q.show .ans{display:block}
.srcline{font-size:15px;color:#666;margin-top:6px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1180px;margin:0 auto}
.compare .fo-box ul{margin:8px 0 0;padding-left:22px;font-size:21px;line-height:1.7}
.sig{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sig span{background:#fff;border:2px solid currentColor;border-radius:999px;padding:4px 12px;font-weight:800;font-size:19px}
.think{max-width:1180px;margin:20px auto 0;background:#fdfaf0;color:var(--ink);border-radius:16px;padding:20px 24px}
.think h3{margin:0 0 10px;font-size:24px}
.think .sent{font-size:26px;font-weight:800;line-height:1.7;background:#fff;border-radius:12px;padding:10px 16px;border:2px dashed #c8c2a8}
.tstep{display:flex;gap:12px;align-items:flex-start;margin-top:10px;font-size:21px;line-height:1.6;opacity:.15;transition:.4s}
.tstep.on{opacity:1}
.tstep b.n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--night2);color:#fff;display:grid;place-items:center}
.motto{max-width:1180px;margin:20px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.motto div{border-radius:16px;padding:16px 18px;font-size:22px;font-weight:800;line-height:1.55;color:var(--ink)}
.drill{max-width:1100px;margin:0 auto}
.drill .phase{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--gold);color:#2a1d00;font-weight:900;font-size:18px}
.drill .sentence{background:#fdfaf0;color:var(--ink);border-radius:18px;padding:30px 34px;font-size:calc(36px*var(--fs));font-weight:800;line-height:1.7;margin:16px 0;min-height:180px;display:flex;align-items:center}
.fo-btns{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fo-btn{border-radius:18px;padding:18px;font-size:34px;font-weight:900;border:5px solid transparent;color:var(--ink)}
.fo-btn small{display:block;font-size:18px;font-weight:700;opacity:.8}
.fo-btn.f{background:var(--fact-bg);border-color:#9cc3ef}
.fo-btn.o{background:var(--opin-bg);border-color:#f3be94}
.fo-btn.right{border-color:var(--ok);box-shadow:0 0 0 6px #1d9a5733;transform:scale(1.02)}
.fo-btn.wrong{opacity:.4}
.explain{margin-top:14px;background:#e5f7ec;color:#0e4a2a;border-radius:14px;padding:14px 18px;font-size:22px;line-height:1.6;display:none}
.explain.on{display:block;animation:fade .3s}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:#cfe0f5;font-size:18px}
/* ───── 练·用：棋盘 ───── */
#v-game{overflow:hidden;background:#cddccf}
.gamewrap{height:100%;display:flex;gap:12px;padding:10px}
.boardbox{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
.board{display:grid;grid-template-columns:1.35fr repeat(9,1fr) 1.35fr;grid-template-rows:1.35fr repeat(6,1fr) 1.35fr;gap:3px;background:#22362a;border:4px solid #22362a;border-radius:8px;position:relative}
.tile{position:relative;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;cursor:pointer;padding:2px}
.tile .band{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*.2);display:flex;align-items:center;justify-content:center;color:#fff;font-family:Arial,sans-serif;font-weight:800;font-size:calc(var(--u)*.13)}
.tile.vert .band{top:0;bottom:0;left:auto;right:0;width:calc(var(--u)*.2);height:auto;writing-mode:vertical-rl}
.tile.vert.left .band{right:0}
.tile.vert.right .band{left:0;right:auto}
.tile .nm{font-weight:800;font-size:calc(var(--u)*.24);line-height:1.15;margin-top:calc(var(--u)*.14)}
.tile.vert .nm{margin-top:0}
.tile .py{font-size:calc(var(--u)*.105);color:#4f6658;line-height:1.2}
.tile .en{font-family:Arial,sans-serif;font-size:calc(var(--u)*.1);font-weight:700;color:#304537;line-height:1.1}
.tile .ic{width:calc(var(--u)*.55);height:calc(var(--u)*.55);background:var(--sprite) no-repeat;background-size:300% 200%}
.ic.chance{background-position:0 0}.ic.chest{background-position:50% 0}.ic.fee{background-position:100% 0}
.ic.repair,.ic.goto{background-position:0 100%}.ic.parking{background-position:50% 100%}.ic.go{background-position:100% 100%}
.tile.chance{background:#f6d29e}.tile.chest{background:#f9e48a}.tile.fee{background:#f3d7c0}
.tile.corner{background:#f4ead6}.tile.corner .nm{font-size:calc(var(--u)*.22);margin-top:0}
.tile.corner .ic{width:calc(var(--u)*.7);height:calc(var(--u)*.7)}
.tile.go .nm{color:#d6262a}
.tile .own{position:absolute;inset:0;border:calc(var(--u)*.06) solid var(--oc);pointer-events:none}
.tile .own:after{content:"🚩";position:absolute;right:1px;bottom:0;font-size:calc(var(--u)*.2)}
.tile.land{animation:land .8s ease 2}
@keyframes land{50%{box-shadow:inset 0 0 0 calc(var(--u)*.08) var(--gold);background:#fff7cf}}
.tokens{position:absolute;left:2px;right:2px;bottom:2px;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;pointer-events:none;z-index:3}
.token{width:calc(var(--u)*.32);height:calc(var(--u)*.32);border-radius:50%;background:var(--tc);border:2px solid #fff;box-shadow:0 2px 4px #0006;color:#fff;font-weight:900;font-size:calc(var(--u)*.17);display:grid;place-items:center;font-family:Arial,sans-serif}
.token.cur{animation:bob .9s ease-in-out infinite;width:calc(var(--u)*.38);height:calc(var(--u)*.38);border-color:var(--gold)}
@keyframes bob{50%{transform:translateY(-4px)}}
.token.hop{animation:hop .25s ease}
@keyframes hop{50%{transform:translateY(-12px) scale(1.15)}}
.center{grid-area:2/2/8/11;position:relative;overflow:hidden;background:#0e1c30 var(--center) center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--u)*.18)}
.center:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b1626cc,#0b162633 40%,#0b1626aa)}
.center>*{position:relative}
.ctitle{color:#fff;font-weight:900;font-size:calc(var(--u)*.5);text-shadow:0 3px 0 #a3420f,0 6px 20px #000a;letter-spacing:3px}
.phasebar{display:flex;gap:8px}
.phasebar span{padding:calc(var(--u)*.05) calc(var(--u)*.16);border-radius:999px;background:#ffffff26;color:#fff;font-weight:800;font-size:calc(var(--u)*.16);border:2px solid #ffffff44}
.phasebar span.on{background:var(--gold);color:#2a1d00;border-color:#fff}
.cbottom{width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.lastlog{background:#000a;color:#fff;border-radius:12px;padding:8px 14px;font-size:calc(var(--u)*.16);max-width:60%;line-height:1.4}
.goal{background:#000a;border-radius:12px;padding:8px 12px;color:#fff;font-size:calc(var(--u)*.14);min-width:34%}
.goal .bar{height:calc(var(--u)*.14);background:#ffffff26;border-radius:99px;overflow:hidden;margin-top:4px}
.goal .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3f,#ff8a3d);width:0;transition:width .6s}
.dicebig{width:calc(var(--u)*1.25);height:calc(var(--u)*1.25);background:#fff;border-radius:18%;box-shadow:0 8px 0 #c9c2a6,0 12px 30px #0008;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12%;gap:4%}
.dicebig.roll{animation:roll .7s ease}
@keyframes roll{0%{transform:rotate(0) scale(1)}30%{transform:rotate(200deg) scale(1.2)}60%{transform:rotate(330deg) scale(.9)}100%{transform:rotate(360deg) scale(1)}}
.pip{border-radius:50%;background:transparent}.pip.on{background:#c52b2b}
.dicewrap{display:flex;gap:16px;align-items:center}
/* 侧栏 */
.sidebar{width:clamp(320px,26vw,470px);display:flex;flex-direction:column;gap:10px;min-height:0}
.card{background:#fff;border-radius:var(--r);padding:12px 14px;box-shadow:0 3px 0 #0001}
.turncard{background:var(--night);color:#fff;border:4px solid var(--tc,#fff)}
.turncard .who{font-size:15px;color:#a9c0dd;font-weight:700}
.turncard .tn{font-size:30px;font-weight:900;display:flex;align-items:center;gap:10px}
.turncard .tn i{width:28px;height:28px;border-radius:50%;background:var(--tc);display:inline-block;border:3px solid #fff}
.turncard .tier{font-size:16px;margin-top:4px}
.rollrow{display:flex;gap:8px;margin-top:10px}
.rollbtn{flex:1;min-height:64px;border-radius:14px;background:var(--accent);color:#1d1203;font-size:26px;font-weight:900;box-shadow:0 4px 0 #a3530f}
.rollbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #a3530f}
.manual{display:flex;gap:4px;margin-top:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:#a9c0dd}
.manual button{width:34px;height:34px;border-radius:8px;background:#ffffff1c;color:#fff;font-weight:800}
.score{flex:1;overflow:auto;padding:8px 10px}
.score h3{margin:2px 4px 8px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.trow{display:grid;grid-template-columns:16px 1fr auto auto;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;font-size:18px}
.trow.cur{background:#fff4d6;box-shadow:inset 0 0 0 2px var(--gold)}
.trow i{width:16px;height:16px;border-radius:50%;background:var(--tc)}
.trow .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .st{font-weight:900;font-size:22px;color:#a2620a;font-family:Arial,sans-serif}
.trow .meta{font-size:13px;color:var(--muted);white-space:nowrap}
.trow.bump .st{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.5);color:var(--ok)}}
.sidetools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.sidetools button{background:#fff;border-radius:10px;min-height:44px;font-weight:800;font-size:15px;box-shadow:0 2px 0 #0001}
.timer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.timer .t{font-family:Arial,sans-serif;font-weight:900;font-size:28px}
.timer.low .t{color:var(--bad)}
/* ───── 任务弹窗 ───── */
dialog{border:0;padding:0;border-radius:20px;background:var(--paper);color:var(--ink);box-shadow:0 30px 100px #000a;max-width:96vw;max-height:94vh}
dialog::backdrop{background:#0b1626d9}
dialog[open]{animation:pop .3s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}}
#task{width:min(1320px,96vw);height:min(900px,93vh)}
.tk{display:flex;flex-direction:column;height:100%}
.tkhead{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#fff;border-bottom:2px solid #e2ddc8;flex-wrap:wrap}
.stchip{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px}
.stchip .b{background:var(--lc,#555);color:#fff;border-radius:8px;padding:3px 9px;font-family:Arial,sans-serif;font-size:16px}
.deckbadge{padding:6px 12px;border-radius:999px;font-weight:900;font-size:17px}
.deck-word{background:#e7f0ff;color:#174a8b}.deck-judge{background:#fff1d6;color:#8a4b00}.deck-say{background:#e5f7ec;color:#0e5a2e}
.tiers{display:flex;gap:4px;margin-left:auto;background:#f1eee2;padding:4px;border-radius:12px}
.tiers button{padding:7px 12px;border-radius:9px;font-weight:800;font-size:16px}
.tiers button[aria-pressed=true]{background:#fff;box-shadow:0 2px 6px #0002}
.tiers button.t-low[aria-pressed=true]{color:var(--low)}.tiers button.t-mid[aria-pressed=true]{color:#a57700}.tiers button.t-high[aria-pressed=true]{color:var(--high)}
.hbtn{min-width:44px;height:42px;border-radius:10px;background:#f1eee2;font-weight:800;padding:0 10px;font-size:16px}
.hbtn.say{background:var(--night2);color:#fff}
.tkbody{flex:1;overflow:auto;padding:18px 26px;font-size:calc(var(--fs)*1px)}
.notice{background:#fff4d6;border:2px solid #f0d58a;border-radius:12px;padding:8px 14px;font-size:18px;margin-bottom:12px}
.factbox{background:var(--fact-bg);border-left:8px solid var(--fact);border-radius:12px;padding:12px 18px;font-size:calc(26px*var(--fs));line-height:1.6;margin-bottom:12px;font-weight:700}
.factbox small{display:block;font-size:16px;color:var(--fact);font-weight:900}
.qtext{font-size:calc(36px*var(--fs));font-weight:800;line-height:1.6;margin:4px 0 14px;white-space:pre-line}
.qtext b,.qtext mark{background:#ffe79a;color:inherit;padding:0 4px;border-radius:6px}
.opts{display:grid;gap:12px}
.opts.c2{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:#fff;border:3px solid #d8d3bd;border-radius:16px;padding:14px 18px;font-size:calc(28px*var(--fs));font-weight:700;line-height:1.45;transition:.2s}
.opt .L{flex:none;width:52px;height:52px;border-radius:12px;background:var(--night2);color:#fff;display:grid;place-items:center;font-family:Arial,sans-serif;font-weight:900;font-size:28px}
.opt .e{font-size:38px;flex:none}
.opt:hover:not(:disabled){border-color:#9c9578}
.opt.right{border-color:var(--ok);background:#e5f7ec}
.opt.right .L{background:var(--ok)}
.opt.wrong{border-color:var(--bad);background:#fdeceA;opacity:.75}
.opt:disabled{opacity:1}
.fo2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.frame{background:#fff;border:3px dashed #b9c9b2;border-radius:16px;padding:14px 20px;font-size:calc(28px*var(--fs));line-height:1.8;font-weight:700;white-space:pre-line}
.frame .gap{display:inline-block;min-width:3.5em;border-bottom:3px solid #6c8a74;margin:0 4px}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.bank button{background:#fff;border:2px solid #b9c9b2;border-radius:12px;padding:6px 14px;font-size:calc(24px*var(--fs));font-weight:800;line-height:1.2}
.bank button small{display:block;font-size:14px;color:#a8681b;font-weight:700}
.criteria{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.criteria button{border-radius:999px;padding:8px 14px;background:#fff;border:2px solid #cfd9cc;font-weight:800;font-size:18px}
.criteria button[aria-pressed=true]{background:#e5f7ec;border-color:var(--ok);color:#0e5a2e}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:2px solid #e2ddc8}
.toolrow button{background:#fff;border:2px solid #d8d3bd;border-radius:10px;padding:8px 14px;font-weight:800;font-size:17px}
.toolrow button[aria-expanded=true]{background:var(--night2);color:#fff;border-color:var(--night2)}
.panel{margin-top:12px;background:#fff;border-radius:14px;padding:14px 18px;border:2px solid #e2ddc8;font-size:calc(22px*var(--fs));line-height:1.6;animation:fade .25s}
.panel h4{margin:0 0 6px;font-size:18px;color:var(--muted)}
.hint{background:#fff8e1;border-color:#f3dc91}
.feedback{margin-top:14px;border-radius:14px;padding:14px 18px;font-size:calc(24px*var(--fs));line-height:1.6;font-weight:700;animation:fade .3s}
.feedback.good{background:#e5f7ec;color:#0e4a2a;border:3px solid var(--ok)}
.feedback.try{background:#fff1e6;color:#7a3c00;border:3px solid #f3be94}
.tkfoot{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#fff;border-top:2px solid #e2ddc8;flex-wrap:wrap}
.tkfoot .spacer{flex:1}
.follow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:16px;font-weight:700;color:var(--muted)}
.follow button{border-radius:999px;padding:6px 12px;border:3px solid var(--tc);font-weight:800;font-size:15px;background:#fff}
.follow button[aria-pressed=true]{background:var(--tc);color:#fff}
.ring{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;font-family:Arial,sans-serif}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:#e2ddc8}.ring .fg{stroke:var(--accent);transition:stroke-dashoffset 1s linear}
/* 事件卡 */
#event{width:min(760px,94vw)}
.ev{padding:22px 26px;text-align:center}
.ev .flip{perspective:1000px;margin:6px auto 14px;width:min(420px,80vw);height:260px}
.ev .inner{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.ev .flip.on .inner{transform:rotateY(180deg)}
.ev .face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;border:4px solid #4b512b}
.ev .front{background:#f9e388}
.ev .front.orange{background:#f3c17e}

  tree() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch { return {}; } },
  save(t) { try { localStorage.setItem(this.key, JSON.stringify(t)); } catch (e) { toast("⚠ 储存空间不足"); } this.ch && this.ch.postMessage("changed"); },
  at(t, path) { return path.split("/").reduce((o, k) => (o[k] ??= {}), t); }
};
let connOK = true, connMsg = "";
function setConn(ok, msg) { connOK = ok; connMsg = msg || ""; const el = document.getElementById("connState"); if (el) el.textContent = connLabel(); }
function connLabel() { return DB.cloud() ? (connOK ? "☁ 云端同步中" : "⚠ 等待同步 · 检查网络") : "💻 单机模式（只限这台电脑）"; }
const DB = {
  cloud: () => !!Cloud.base(),
  async get(path) { if (this.cloud()) return Cloud.req(path); const t = Local.tree(); return path.split("/").reduce((o, k) => o?.[k], t) ?? null; },
  async patch(path, obj) {
    if (this.cloud()) return Cloud.req(path, "PATCH", obj);
    const t = Local.tree(); Object.assign(Local.at(t, path), obj); Local.save(t);
  },
  async del(path) {
    if (this.cloud()) return Cloud.req(path, "DELETE");
    const t = Local.tree(), ks = path.split("/"), last = ks.pop(), parent = ks.reduce((o, k) => o?.[k], t); if (parent) delete parent[last]; Local.save(t);
  },
  watch(path, cb) {
    let stop = false, fail = 0;
    if (!this.cloud()) { const f = async () => { if (!stop) cb(await this.get(path)); }; Local.ch && Local.ch.addEventListener("message", f); addEventListener("storage", e => { if (e.key === Local.key) f(); }); f(); return () => { stop = true; }; }
    const tick = async () => { if (stop) return; try { cb(await this.get(path)); fail = 0; setConn(true); } catch (e) { fail++; setConn(false, e.message); } setTimeout(tick, CONFIG.SYNC_MS * Math.min(4, 1 + fail)); };
    tick(); return () => { stop = true; };
  }
};
const ROOM_ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newRoomCode() { const a = new Uint32Array(6); crypto.getRandomValues(a); return [...a].map(x => ROOM_ABC[x % ROOM_ABC.length]).join(""); }
function studentLink(room) {
  const dir = location.href.split("#")[0].split("?")[0].replace(/[^/]*$/, "");
  const db = Cloud.base();
  return `${dir}${CONFIG.STUDENT_FILE}?room=${room}${db ? "&db=" + encodeURIComponent(db) : ""}`;
}
</script>
<script>
'use strict';
/* ═════════ 学生端：🏁 终点站（⚡ 快问快答 → 🗣️ 说一说 → ✅ 自评）＋ 🏠 作业 ═════════
   学生的回答会同步到教师控制台（云端模式可跨设备；单机模式只限同一台电脑）。 */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/_{2,}/g, '<span class="gap"></span>');
let toastT;
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms); }

/* 网址参数：?room=课堂码&db=Firebase网址（老师在控制台复制的链接会自动带上） */
const Q = new URLSearchParams(location.search);
if (Q.get("db") && Cloud.ok(Q.get("db"))) { try { localStorage.setItem(DBKEY, Q.get("db")); } catch { } }
const ROOM = (Q.get("room") || CONFIG.DEFAULT_ROOM).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
const SKEY = CONFIG.LESSON_ID + "_stu_" + ROOM;
function load() { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch { return {}; } }
let ST = Object.assign({ pid: "", name: "", tab: "quiz", qi: 0, quiz: {}, say: { text: "", sent: false }, help: false, helpUsed: false, self: {}, hw: { F: null, O: null, done: false }, pinyin: true, fs: 1, t0: 0 }, load());
function saveLocal() { try { localStorage.setItem(SKEY, JSON.stringify(ST)); } catch { } }
let pending = false;
async function sync() {
  if (!ST.pid) return;
  const data = { name: ST.name, t0: ST.t0, updated: Date.now(), quiz: ST.quiz, self: ST.self, hw: ST.hw };
  if (ST.say.sent) data.say = { text: ST.say.text, flag: ST.say.flag || 0, t: ST.say.t, help: ST.helpUsed ? 1 : 0 };
  try { await DB.patch(PATH(ROOM) + "/players/" + ST.pid, data); pending = false; setConn(true); }
  catch (e) { pending = true; setConn(false, e.message); }
  const el = $("#connState"); if (el) el.textContent = pending ? "⚠ ⏳" : (DB.cloud() ? "☁ ✔" : "💻");
}
setInterval(() => { if (pending) sync(); }, 5000);
function set(fn, noSync) { fn(ST); saveLocal(); render(); if (!noSync) sync(); }

/* ── 拼音（与大屏幕相同） ── */
const PY = {
  ok: typeof pinyinPro !== "undefined",
  init() { if (this.ok) pinyinPro.customPinyin({ "了不起": "liǎo bu qǐ", "休息": "xiū xi", "觉得": "jué de", "一百多": "yì bǎi duō", "勤劳": "qín láo" }); },
  apply(root) {
    if (!ST.pinyin || !this.ok || !root) return;
    const skip = "rt,ruby,script,style,textarea,input,select,option,.nopy,svg";
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (/[㐀-鿿]/.test(n.nodeValue) && n.parentElement && !n.parentElement.closest(skip)) ? 1 : 2 });
    const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
    for (const n of nodes) {
      const f = document.createElement("span"); f.className = "pyw"; let buf = "";
      for (const it of pinyinPro.pinyin(n.nodeValue, { type: "all" })) {
        if (it.isZh) { if (buf) { f.appendChild(document.createTextNode(buf)); buf = ""; } const r = document.createElement("ruby"); r.textContent = it.origin; const rt = document.createElement("rt"); rt.textContent = it.pinyin; r.appendChild(rt); f.appendChild(r); }
        else buf += it.origin;
      }
      if (buf) f.appendChild(document.createTextNode(buf));
      n.parentNode.replaceChild(f, n);
    }
  }
};
PY.init();
/* ── 朗读（自动挑选最自然的中文声音） ── */
const Voice = {
  list: [], cur: null,
  score(v) { const n = v.name, l = (v.lang || "").toLowerCase(); let s = 0; if (/natural|neural|online/i.test(n)) s += 60; if (/xiaoxiao|xiaoyi|yunxi/i.test(n)) s += 25; if (/google/i.test(n)) s += 30; if (/enhanced|premium/i.test(n)) s += 20; if (/huihui|kangkang|yaoyao|compact/i.test(n)) s -= 25; if (/zh[-_]cn|cmn/.test(l)) s += 12; else if (/zh[-_]sg/.test(l)) s += 14; else if (/zh[-_]hk|yue/.test(l)) s -= 30; return s; },
  load() { if (!("speechSynthesis" in window)) return; this.list = speechSynthesis.getVoices().filter(v => /^(zh|cmn)/i.test(v.lang)).sort((a, b) => this.score(b) - this.score(a)); this.cur = this.list[0] || null; },
  speak(t) {
    if (!("speechSynthesis" in window)) return; if (!this.list.length) this.load(); speechSynthesis.cancel();
    t = String(t).replace(/\*\*/g, "").replace(/_{2,}/g, "，空格，").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, "").replace(/\n+/g, "。");
    t.split(/(?<=[。！？])/).filter(x => x.trim()).forEach(p => { const u = new SpeechSynthesisUtterance(p); if (this.cur) { u.voice = this.cur; u.lang = this.cur.lang; } else u.lang = "zh-CN"; u.rate = .85; speechSynthesis.speak(u); });
  }
};
if ("speechSynthesis" in window) { Voice.load(); speechSynthesis.onvoiceschanged = () => Voice.load(); }
const say = (t, cls = "hbtn say") => `<button class="${cls}" data-act="say" data-text="${esc(t)}" aria-label="朗读">🔊</button>`;
/* ── 简单音效 ── */
const Sfx = { c: null, tone(f, d, type = "triangle", v = .15, w = 0) { try { this.c = this.c || new (window.AudioContext || window.webkitAudioContext)(); const t = this.c.currentTime + w, o = this.c.createOscillator(), g = this.c.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(this.c.destination); o.start(t); o.stop(t + d + .05); } catch { } },
  right() { [523, 659, 784].forEach((f, i) => this.tone(f, .2, "triangle", .15, i * .08)); }, wrong() { this.tone(220, .3, "sine", .12); }, pop() { this.tone(660, .08, "sine", .12); } };

/* ── 学生输入安全筛查（初步，不能取代老师的判断） ── */
function screen(t) {
  if (/[STFGM]\d{7}[A-Z]/i.test(t) || /\b[689]\d{7}\b/.test(t) || /[\w.+-]+@[\w-]+\.[\w.]+/.test(t)) return { lv: 2, msg: "⚠ 不要写电话、电邮、身份证号码。Please remove personal info." };
  if (/(自杀|想死|不想活|伤害自己|割自己|被欺负|被打|kill myself|suicide|hurt myself|bully)/i.test(t)) return { lv: 3 };
  if (/(笨蛋|白痴|傻瓜|去死|滚开|他妈|fuck|shit|stupid|idiot|dumb|bitch)/i.test(t)) return { lv: 2, msg: "🙂 请用好听的话再写一次。Please use kind words." };
  return { lv: 1 };
}

/* ═════════ 画面 ═════════ */
const TABS = [["quiz", "⚡ 1"], ["say", "🗣️ 2"], ["self", "✅ 3"], ["hw", "🏠 作业"]];
const FACES = ["😄", "🙂", "🤔"];
function markSent(s, m) { return m ? esc(s).replace(esc(m), `<mark>${esc(m)}</mark>`) : esc(s); }
function render() {
  document.documentElement.style.setProperty("--fs", ST.fs);
  document.body.classList.toggle("py-on", !!ST.pinyin);
  $("#bPy").setAttribute("aria-pressed", ST.pinyin);
  const app = $("#stu");
  if (!ST.pid) {
    app.innerHTML = `<div class="joincard"><h1>🏁 终点站</h1>
      <label for="nm">名字 <small class="en">name</small></label><input id="nm" maxlength="12" autocomplete="off" value="${esc(ST.name)}">
      <p class="room nopy">🔑 ${esc(ROOM)}</p>
      <button class="btn primary big" data-act="join" aria-label="进入">➡</button></div>`;
    PY.apply(app); const i = $("#nm"); i.focus(); i.onkeydown = e => e.key === "Enter" && ACT.join(); return;
  }
  const tabs = `<div class="tabs">${TABS.map(([k, t]) => `<button role="tab" aria-selected="${ST.tab === k}" data-act="tab" data-t="${k}">${t}${doneMark(k)}</button>`).join("")}</div>`;
  let body = "";
  if (ST.tab === "quiz") {
    const n = LESSON.quiz.length, i = ST.qi, q = LESSON.quiz[i], p = ST.quiz[i];
    body = `<div class="dots">${LESSON.quiz.map((x, k) => `<span class="${k === i ? "on" : ST.quiz[k] ? (ST.quiz[k] === x.a ? "ok" : "no") : ""}"></span>`).join("")}</div>
      <div class="scard"><div class="sent">“${p ? markSent(q.s, q.mark) : esc(q.s)}”</div>${say(q.s)}</div>
      <div class="fo2">${["F", "O"].map(k => `<button class="fo-btn ${k === "F" ? "f" : "o"} ${p ? (k === q.a ? "right" : k === p ? "wrong" : "") : ""}" data-act="qpick" data-v="${k}" ${p ? "disabled" : ""}>${k === "F" ? "📘 事实" : "🧡 意见"}</button>`).join("")}</div>
      ${p ? `<div class="fb ${p === q.a ? "good" : "try"}">${p === q.a ? "🎉 ✔" : "👀 ✖"}</div>` : ""}
      <div class="nav">${i > 0 ? `<button class="btn ghost" data-act="qgo" data-d="-1">←</button>` : "<span></span>"}${p ? (i < n - 1 ? `<button class="btn primary big" data-act="qgo" data-d="1">➡</button>` : `<button class="btn primary big" data-act="tab" data-t="say">🗣️ ➡</button>`) : ""}</div>`;
  }
  if (ST.tab === "say") {
    const qs = LESSON.quizSay;
    body = `<div class="factbox"><small>📘</small>${esc(qs.fact)} ${say(qs.fact + "。你觉得怎么样？为什么？")}</div>
      <div class="frame">${rich(qs.frame)}</div>
      <div class="helpbar"><button class="btn ${ST.help ? "gold" : "ghost"}" data-act="help" aria-expanded="${ST.help}">💡 帮帮我 <small class="en nopy">help</small></button></div>
      ${ST.help ? helpHTML(qs.help) : ""}
      <textarea id="sayIn" maxlength="200" rows="3" placeholder="✍️" aria-label="我的意见">${esc(ST.say.text)}</textarea>
      <div class="nav"><span class="nopy" style="color:#9fb6d3">${ST.say.sent ? "✔ 📤" : ""}</span><button class="btn primary big" data-act="sendSay" aria-label="提交">📤 提交</button></div>
      ${ST.say.sent ? `<div class="nav"><span></span><button class="btn gold big" data-act="tab" data-t="self">✅ ➡</button></div>` : ""}`;
  }
  if (ST.tab === "self") {
    body = `<div class="selfs">${LESSON.selfCheck.map((c, i) => `<div class="srow"><div class="s"><span class="e">${c.e}</span> ${esc(c.s)} ${say(c.s)}</div>
      <div class="faces">${FACES.map((f, j) => `<button class="${ST.self[i] === j ? "on" : ""}" data-act="self" data-i="${i}" data-j="${j}" aria-label="${["学会了", "还好", "还不太懂"][j]}">${f}</button>`).join("")}</div></div>`).join("")}</div>
      ${Object.keys(ST.self).length >= LESSON.selfCheck.length ? `<div class="fb good" style="text-align:center">🎉🎉🎉</div>` : ""}`;
  }
  if (ST.tab === "hw") {
    const H = LESSON.hw, hw = ST.hw;
    body = `<div class="paper"><div class="mast"><span><b>${esc(H.paper)}</b></span><span>🏠</span></div><div class="headline">${esc(H.title)}</div>
      <div class="hwgoal"><span class="tag f">📘 事实 ×1</span><span class="tag o">🧡 意见 ×1</span></div>
      ${H.sents.map((x, i) => { const st = hw.done ? (hw.F === i ? (x.a === "F" ? "ok" : "no") : hw.O === i ? (x.a === "O" ? "ok" : "no") : "") : ""; return `<div class="hrow ${st}"><span class="n">${i + 1}</span><span class="t">${esc(x.s)}</span>${say(x.s)}
        <button class="pick f ${hw.F === i ? "on" : ""}" data-act="hpick" data-k="F" data-i="${i}" aria-label="事实">📘</button><button class="pick o ${hw.O === i ? "on" : ""}" data-act="hpick" data-k="O" data-i="${i}" aria-label="意见">🧡</button></div>`; }).join("")}
      <div class="nav"><button class="btn" data-act="readHw" aria-label="朗读全文">🔊 ▶</button><button class="btn primary big" data-act="sendHw" ${hw.F === null || hw.O === null ? "disabled" : ""} aria-label="提交">📤 提交</button></div>
      ${hw.done ? `<div class="fb ${H.sents[hw.F].a === "F" && H.sents[hw.O].a === "O" ? "good" : "try"}">${H.sents[hw.F].a === "F" && H.sents[hw.O].a === "O" ? "🎉 ✔ ✔" : "👀 再试一次 / try again"}</div>` : ""}</div>`;
  }
  app.innerHTML = `<div class="who nopy">👤 ${esc(ST.name)} <span id="connState" class="pill">${pending ? "⚠ ⏳" : DB.cloud() ? "☁ ✔" : "💻"}</span></div>${tabs}<div class="pane">${body}</div>`;
  PY.apply(app);
  const si = $("#sayIn"); if (si) si.oninput = () => { ST.say.text = si.value; saveLocal(); };
}
/* 💡 辅助词语：分四组（开头／谁／感受／原因），点一下就加进答案并朗读 */
function helpHTML(h) {
  if (!h) return "";
  const grp = (ic, list) => `<div class="hgrp"><span class="hic">${ic}</span>${list.map(([w, py, en]) => `<button class="chip nopy" data-act="addWord" data-w="${esc(w)}"><b>${esc(w)}</b><small>${py}</small><small class="en">${esc(en)}</small></button>`).join("")}</div>`;
  return `<div class="helpbox">${grp("✏️", h.start)}${grp("👷", h.who)}${grp("💭", h.feel)}${grp("❓", h.why)}</div>`;
}
function doneMark(k) {
  if (k === "quiz") return Object.keys(ST.quiz).length >= LESSON.quiz.length ? " ✔" : "";
  if (k === "say") return ST.say.sent ? " ✔" : "";
  if (k === "self") return Object.keys(ST.self).length >= LESSON.selfCheck.length ? " ✔" : "";
  if (k === "hw") return ST.hw.done ? " ✔" : "";
  return "";
}

/* ═════════ 动作 ═════════ */
const ACT = {};
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b || b.disabled) return; const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b); } });
ACT.say = b => Voice.speak(b.dataset.text);
ACT.help = () => { Sfx.pop(); set(s => { s.help = !s.help; if (s.help) s.helpUsed = true; }, true); };
ACT.addWord = b => {
  const w = b.dataset.w, ta = $("#sayIn"); if (!ta) return;
  const a = ta.selectionStart ?? ta.value.length, z = ta.selectionEnd ?? ta.value.length;
  ta.value = ta.value.slice(0, a) + w + ta.value.slice(z); ST.say.text = ta.value; saveLocal();
  const pos = a + w.length; ta.focus(); try { ta.setSelectionRange(pos, pos); } catch { }
  Sfx.pop(); Voice.speak(w.replace(/[，,]$/, ""));
};
ACT.join = () => {
  const n = ($("#nm").value || "").trim().slice(0, 12);
  if (!n) { $("#nm").classList.add("shake"); return toast("✍️ 名字 name"); }
  if (/[STFGM]\d{7}[A-Z]/i.test(n) || /\d{8}/.test(n)) return toast("⚠ 只写名字 name only");
  set(s => { s.name = n; s.pid = s.pid || (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); s.t0 = s.t0 || Date.now(); });
};
ACT.tab = b => set(s => { s.tab = b.dataset.t; }, true);
ACT.qpick = b => { const i = ST.qi, q = LESSON.quiz[i]; b.dataset.v === q.a ? Sfx.right() : Sfx.wrong(); set(s => { s.quiz[i] = b.dataset.v; }); };
ACT.qgo = b => set(s => { s.qi = Math.max(0, Math.min(LESSON.quiz.length - 1, s.qi + +b.dataset.d)); }, true);
ACT.sendSay = () => {
  const t = ($("#sayIn").value || "").trim();
  if (t.length < 2) return toast("✍️");
  const r = screen(t);
  if (r.lv === 2) return toast(r.msg, 4000);
  set(s => { s.say = { text: t, sent: true, t: Date.now(), flag: r.lv === 3 ? 1 : 0 }; });
  Sfx.right();
  toast(r.lv === 3 ? "💛 谢谢你告诉我们。你可以找老师或信任的大人聊一聊。You can talk to a teacher you trust." : "📤 ✔", r.lv === 3 ? 7000 : 2000);
};
ACT.self = b => { Sfx.pop(); set(s => { s.self[+b.dataset.i] = +b.dataset.j; }); };
ACT.hpick = b => { const k = b.dataset.k, i = +b.dataset.i; Sfx.pop(); set(s => { s.hw[k] = s.hw[k] === i ? null : i; if (s.hw.F === s.hw.O) s.hw[k === "F" ? "O" : "F"] = null; s.hw.done = false; }, true); };
ACT.sendHw = () => { const H = LESSON.hw.sents, ok = H[ST.hw.F].a === "F" && H[ST.hw.O].a === "O"; ok ? Sfx.right() : Sfx.wrong(); set(s => { s.hw.done = true; s.hw.t = Date.now(); }); };
ACT.readHw = () => Voice.speak(LESSON.hw.title + "。" + LESSON.hw.sents.map(x => x.s).join(""));
$("#bPy").onclick = () => set(s => { s.pinyin = !s.pinyin; }, true);
$("#bSmaller").onclick = () => set(s => { s.fs = Math.max(.8, +(s.fs - .1).toFixed(2)); }, true);
$("#bLarger").onclick = () => set(s => { s.fs = Math.min(1.5, +(s.fs + .1).toFixed(2)); }, true);
/* 🔄 重新开始：清除这部设备上的答案，回到输入名字的画面（给下一位同学用，或自己重做）。已提交给老师的答案不会删除。 */
let resetT;
$("#bReset").onclick = () => {
  const b = $("#bReset");
  if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.classList.add("sure"); b.textContent = "🔄 ?"; toast("🔄 再按一次重新开始 Press again to restart", 3000); clearTimeout(resetT); resetT = setTimeout(() => { b.dataset.sure = ""; b.classList.remove("sure"); b.textContent = "🔄"; }, 3000); return; }
  clearTimeout(resetT); b.dataset.sure = ""; b.classList.remove("sure"); b.textContent = "🔄";
  const keep = { pinyin: ST.pinyin, fs: ST.fs };
  try { localStorage.removeItem(SKEY); } catch { }
  ST = Object.assign({ pid: "", name: "", tab: "quiz", qi: 0, quiz: {}, say: { text: "", sent: false }, help: false, helpUsed: false, self: {}, hw: { F: null, O: null, done: false }, pinyin: true, fs: 1, t0: 0 }, keep);
  saveLocal(); if ("speechSynthesis" in window) speechSynthesis.cancel(); render(); toast("🔄 ✔");
};
render();
if (ST.pid) sync();
</script>
